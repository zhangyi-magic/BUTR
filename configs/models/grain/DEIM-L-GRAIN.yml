__include__: [
  '../../dataset/grain_detection.yml',
  '../../runtime.yml',
  '../include/dataloader_deim.yml',
  '../include/optimizer.yml',
  '../include/butr_hgnetv2.yml',
]


output_dir: ./output/deim_l_grain


BUTR:
  backbone: HGNetv2
  decoder: DFINETransformer

HGNetv2:
  name: 'B4'
  return_idx: [0, 1, 2, 3]
  freeze_stem_only: True
  freeze_at: -1
  freeze_norm: False

DFINETransformer:
  activation: silu
  mlp_act: silu
  num_layers: 4  # 5 6
  num_levels: 4
  eval_idx: -1  # -2 -3
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  num_points: [4, 4, 4, 4]
  num_queries: 400

HybridEncoder:
  in_channels: [128, 512, 1024, 2048]
  feat_strides: [4, 8, 16, 32]
  use_encoder_idx: [3] # Only not deformable
  use_hybrid: True
  num_encoder_layers: 1
  use_deformable: False
  enc_n_points: 6 # Only deformable
  hidden_dim: 256
  depth_mult: 1
  expansion: 1
  num_feature_levels: 4

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.000065


#lr_scheduler:
#  type: MultiStepLR
#  milestones: [80, 120]
#  gamma: 0.8

# Increase to search for the optimal ema
epoches: 58

# Our LR-Scheduler
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 29
no_aug_epoch: 8


train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 29, 50]
  collate_fn:
    mixup_epochs: [4, 29]
    stop_epoch: 50
#    ema_restart_decay: 0.9999
#    base_size_repeat: 2

